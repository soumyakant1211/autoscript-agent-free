# Free CI: checks the server boots and serves the stack list on every push.
name: CI
on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - name: Boot server in mock mode and check endpoints
        run: |
          (MOCK_MODE=1 PORT=8080 node server.js &) ; sleep 3
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/api/stacks > /dev/null
          curl -sfN -X POST http://localhost:8080/api/generate -H 'content-type: application/json' \
            -d '{"stackId":"ts-playwright","description":"Login flow smoke test"}' | grep -q "event: done"
