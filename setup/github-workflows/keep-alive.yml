# Free keep-alive: pings the app every 10 minutes so Render's free instance doesn't sleep.
# Set the repository variable APP_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://autoscript-agent.onrender.com
# Note: GitHub pauses scheduled workflows after 60 days without commits — re-enable from the Actions tab if needed.
name: Keep alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ping
        run: |
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then echo "Set the APP_URL repository variable"; exit 0; fi
          curl -sf --retry 3 --retry-delay 10 --max-time 90 "$URL/api/ping" && echo " ✓ awake"
